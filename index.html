<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>樱花之约</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
width: 100%; height: 100%;
overflow: hidden;
font-family: "WenQuanYi Micro Hei", "PingFang SC", "Microsoft YaHei", sans-serif;
background: #000;
touch-action: manipulation;
-webkit-tap-highlight-color: transparent;
}
#app {
position: relative;
width: 100%; height: 100%;
max-width: 900px;
margin: 0 auto;
overflow: hidden;
}
/* 背景层 */
#bg {
position: absolute; inset: 0;
background-size: cover;
background-position: center;
transition: background-image 0.8s ease;
filter: brightness(0.55);
}
#bg::after {
content: "";
position: absolute; inset: 0;
background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.1) 100%);
}
/* 角色立绘 */
#character {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
height: 78%;
max-height: 640px;
opacity: 0;
transition: opacity 0.6s ease, transform 0.6s ease;
pointer-events: none;
filter: drop-shadow(0 0 30px rgba(255,180,200,0.15));
}
#character.show { opacity: 1; }
/* 对话框 */
#dialogueBox {
position: absolute;
left: 50%; bottom: 16px;
transform: translateX(-50%);
width: calc(100% - 32px);
min-height: 170px;
background: rgba(20, 15, 25, 0.82);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 200, 220, 0.25);
border-radius: 16px;
padding: 18px 20px 56px;
color: #fff;
box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
#speaker {
font-size: 17px;
font-weight: bold;
color: #ffb6c8;
margin-bottom: 8px;
text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
#text {
font-size: 16px;
line-height: 1.75;
min-height: 60px;
color: #f5f0f3;
}
.cursor {
display: inline-block;
width: 8px;
animation: blink 0.7s infinite;
color: #ffb6c8;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
/* 点击继续提示 */
#nextHint {
position: absolute;
right: 18px; bottom: 14px;
font-size: 13px;
color: rgba(255,200,220,0.7);
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
/* 选项按钮 */
#choices {
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
width: calc(100% - 48px);
display: none;
flex-direction: column;
gap: 12px;
z-index: 20;
}
.choice-btn {
background: rgba(40, 25, 40, 0.9);
border: 1px solid rgba(255, 180, 200, 0.5);
color: #fff;
font-size: 16px;
padding: 16px 20px;
border-radius: 12px;
cursor: pointer;
transition: all 0.25s;
font-family: inherit;
}
.choice-btn:hover, .choice-btn:active {
background: rgba(255, 120, 160, 0.35);
transform: scale(1.02);
}
/* 顶部信息栏 */
#topBar {
position: absolute; top: 12px; left: 12px; right: 12px;
display: flex; justify-content: space-between; align-items: center;
z-index: 15;
}
#menuBtn {
background: rgba(20,15,25,0.7);
border: 1px solid rgba(255,200,220,0.3);
color: #ffb6c8;
width: 40px; height: 40px;
border-radius: 50%;
font-size: 20px;
cursor: pointer;
}
/* 菜单面板 */
#menuPanel {
position: absolute; inset: 0;
background: rgba(10,5,15,0.92);
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 18px;
z-index: 30;
padding: 24px;
}
#menuPanel h2 { color: #ffb6c8; font-size: 24px; margin-bottom: 10px; }
.menu-item {
width: 100%; max-width: 300px;
background: rgba(255,180,200,0.12);
border: 1px solid rgba(255,180,200,0.3);
color: #fff;
padding: 14px;
border-radius: 12px;
font-size: 16px;
cursor: pointer;
text-align: center;
font-family: inherit;
}
.menu-item:hover { background: rgba(255,120,160,0.3); }
/* 标题画面 */
#titleScreen {
position: absolute; inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 25;
background: radial-gradient(circle at 50% 40%, rgba(180,60,100,0.4), rgba(0,0,0,0.95));
}
#titleScreen h1 {
font-size: 42px;
color: #fff;
text-shadow: 0 0 20px rgba(255,120,160,0.8);
margin-bottom: 8px;
letter-spacing: 6px;
}
#titleScreen .sub {
color: rgba(255,200,220,0.7);
font-size: 15px;
margin-bottom: 60px;
letter-spacing: 3px;
}
.start-btn {
background: linear-gradient(135deg, #ff7aa0, #c06090);
border: none;
color: #fff;
font-size: 20px;
padding: 16px 48px;
border-radius: 30px;
cursor: pointer;
box-shadow: 0 6px 24px rgba(255,100,150,0.5);
font-family: inherit;
letter-spacing: 4px;
animation: float 2s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
/* 结局画面 */
#endingScreen {
position: absolute; inset: 0;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 25;
background: rgba(5,0,10,0.95);
padding: 24px;
text-align: center;
}
#endingScreen h2 { color: #ffb6c8; font-size: 28px; margin-bottom: 16px; }
#endingScreen p { color: #ddd; font-size: 16px; line-height: 1.8; max-width: 600px; }
#endingScreen .back-btn {
margin-top: 40px;
background: rgba(255,180,200,0.15);
border: 1px solid rgba(255,180,200,0.4);
color: #fff; padding: 12px 36px; border-radius: 24px;
font-size: 16px; cursor: pointer; font-family: inherit;
}
/* 樱花粒子 */
.petal {
position: absolute;
top: -20px;
width: 12px; height: 12px;
background: radial-gradient(circle at 30% 30%, #ffd6e0, #ffb6c8);
border-radius: 50% 0 50% 50%;
opacity: 0.7;
pointer-events: none;
z-index: 5;
animation: fall linear infinite;
}
@keyframes fall {
0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.8; }
100% { transform: translateY(110vh) rotate(360deg) translateX(60px); opacity: 0; }
}
/* ============ 章节选择面板 ============ */
#chapterPanel {
  position: absolute; inset: 0;
  background: rgba(10,5,15,0.94);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  z-index: 35;
  padding: 32px 24px;
  overflow-y: auto;
}
#chapterPanel h2 {
  color: #ffb6c8;
  font-size: 24px;
  margin-bottom: 24px;
  letter-spacing: 4px;
}
.chapter-list {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chapter-card {
  background: rgba(255,180,200,0.08);
  border: 1px solid rgba(255,180,200,0.25);
  border-radius: 14px;
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.chapter-card:hover:not(.locked) {
  background: rgba(255,120,160,0.2);
  border-color: rgba(255,180,200,0.6);
  transform: scale(1.02);
}
.chapter-card.locked {
  opacity: 0.45;
  cursor: not-allowed;
}
.chapter-card .chapter-title {
  color: #fff;
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 6px;
}
.chapter-card .chapter-desc {
  color: rgba(255,200,220,0.65);
  font-size: 13px;
  line-height: 1.6;
}
.chapter-status {
  position: absolute;
  top: 14px; right: 16px;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: bold;
}
.status-cleared { background: rgba(100,220,140,0.2); color: #7offaf; border: 1px solid rgba(100,220,140,0.4); }
.status-available { background: rgba(255,180,200,0.2); color: #ffb6c8; border: 1px solid rgba(255,180,200,0.4); }
.status-locked { background: rgba(255,255,255,0.08); color: #999; border: 1px solid rgba(255,255,255,0.15); }
.chapter-close-btn {
  margin-top: 28px;
  width: 100%;
  max-width: 300px;
  background: rgba(255,180,200,0.12);
  border: 1px solid rgba(255,180,200,0.3);
  color: #fff;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
}
.chapter-close-btn:hover { background: rgba(255,120,160,0.3); }

</style>
</head>

<div id="endingScreen">

<div id="chapterPanel">

<ellipse cx="140" cy="220" rx="14" ry="8" fill="%23ffb6c8" opacity="0.5"/>
<ellipse cx="260" cy="220" rx="14" ry="8" fill="%23ffb6c8" opacity="0.5"/>

// ============ 引擎 ============
let currentNode = "start";
let typingTimer = null;
let isTyping = false;
let typewriterQueue = "";
let historyLog = [];
let petalTimer = null;

const $ = id => document.getElementById(id);
const bgEl = $("bg");
const charEl = $("character");
const speakerEl = $("speaker");
const textEl = $("text");
const choicesEl = $("choices");
const dialogueBox = $("dialogueBox");
// ============ 章节选择 ============
const CHAPTERS = [
  {
    id: "ch0",
    title: "序章 · 樱花之约",
    desc: "",
    startNode: "start",
    require: null
  },
{
  id: "ch1",
  title: "第一章 · 雨日图书馆",
  desc: "",
  startNode: "ss1", 
  require: "ch0",
  locked: true
}

];

function getClearedChapters() {
  try {
    return JSON.parse(localStorage.getItem("clearedChapters") || "[]");
  } catch(e) { return []; }
}
function saveClearedChapter(id) {
  const cleared = getClearedChapters();
  if (!cleared.includes(id)) {
    cleared.push(id);
    localStorage.setItem("clearedChapters", JSON.stringify(cleared));
  }
}

function openChapterPanel() {
  const cleared = getClearedChapters();
  const listEl = document.getElementById("chapterList");
  listEl.innerHTML = "";

  CHAPTERS.forEach(ch => {
    let status = "locked";
    if (ch.locked) {
      status = "locked"; 
    } else if (!ch.require) {
      status = cleared.includes(ch.id) ? "cleared" : "available";
    } else if (cleared.includes(ch.require)) {
      status = cleared.includes(ch.id) ? "cleared" : "available";
    }

const card = document.createElement("div");
card.className = "chapter-card" + (status === "locked" ? " locked" : "");
const statusText = status === "cleared" 
  ? "已通关" 
  : status === "available" 
  ? "可进入" 
  : ch.locked 
  ? "未开放" 
  : "未解锁";
card.innerHTML = `
  <div class="chapter-title">${ch.title}</div>
  <div class="chapter-desc">${ch.desc}</div>
  <div class="chapter-status status-${status}">${statusText}</div>
`;
if (status !== "locked") {
  card.onclick = () => enterChapter(ch);
}
listEl.appendChild(card);

  });

  document.getElementById("chapterPanel").style.display = "flex";
}

function closeChapterPanel() {
  document.getElementById("chapterPanel").style.display = "none";
}

function enterChapter(chapter) {
  closeChapterPanel();
  $("titleScreen").style.display = "none";
  $("endingScreen").style.display = "none";
  dialogueBox.style.display = "block";
  currentNode = chapter.startNode;
  historyLog = [];
  showNode(chapter.startNode);
  spawnPetals();
}

// 在结局处记录通关
const _origShowEnding = showEnding;
showEnding = function(node) {
  if (node === script["ending_a"]) saveClearedChapter("ch1");
  if (node === script["ending_b"]) saveClearedChapter("ch2");
  saveClearedChapter("ch0");
  _origShowEnding(node);
};

buildScript();

function startGame() {
$("titleScreen").style.display = "none";
currentNode = "start";
historyLog = [];
showNode("start");
spawnPetals();
}

function showNode(id) {
const node = script[id];
if (!node) return;
currentNode = id;

if (node.ending) {
showEnding(node);
return;
}

// 背景
if (node.bg) bgEl.style.backgroundImage = `url('${backgrounds[node.bg]}')`;

// 角色
if (node.char && node.expr) {
charEl.src = characters[node.char][node.expr];
charEl.classList.add("show");
} else {
charEl.classList.remove("show");
}

// 对话
speakerEl.textContent = node.speaker || "";
typeText(node.text || "");

// 历史
if (node.text) historyLog.push({ speaker: node.speaker, text: node.text });

// 选项
if (node.choices && node.choices.length > 0) {
setTimeout(() => showChoices(node.choices), 600);
} else {
choicesEl.style.display = "none";
}
}

function typeText(str) {
clearInterval(typingTimer);
textEl.innerHTML = "";
isTyping = true;
let i = 0;
const cursor = document.createElement("span");
cursor.className = "cursor";
cursor.innerHTML = "█";

typingTimer = setInterval(() => {
if (i < str.length) {
// 支持 \n，忽略 \b
const ch = str[i] === "\n" ? "<br>" : (str[i] === "\b" ? "" : str[i]);
textEl.innerHTML += ch;
i++;
} else {
clearInterval(typingTimer);
isTyping = false;
}
}, 35);
}

function showChoices(choices) {
choicesEl.innerHTML = "";
choices.forEach(c => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.textContent = c.text;
btn.onclick = () => {
choicesEl.style.display = "none";
showNode(c.next);
};
choicesEl.appendChild(btn);
});
choicesEl.style.display = "flex";
}

function showEnding(node) {
charEl.classList.remove("show");
dialogueBox.style.display = "none";
$("endingTitle").textContent = node.title;
$("endingText").textContent = node.text;
$("endingScreen").style.display = "flex";
}

function backToTitle() {
$("endingScreen").style.display = "none";
dialogueBox.style.display = "block";
$("titleScreen").style.display = "flex";
bgEl.style.backgroundImage = `url('${backgrounds.sakura}')`;
}

// 点击继续
document.addEventListener("click", (e) => {
// 忽略按钮点击
if (e.target.tagName === "BUTTON") return;
if (e.target.closest("#choices")) return;
if (e.target.closest("#menuPanel")) return;
if ($("titleScreen").style.display !== "none") return;
if ($("endingScreen").style.display === "flex") return;
if ($("menuPanel").style.display === "flex") return;

const node = script[currentNode];
if (!node) return;

if (isTyping) {
// 跳过打字
clearInterval(typingTimer);
textEl.innerHTML = (node.text || "").replace(/\n/g, "<br>").replace(/\b/g, "");
isTyping = false;
} else if (node.choices && node.choices.length > 0) {
// 有选项时不跳过
return;
} else if (node.next) {
showNode(node.next);
}
});

// 菜单
function toggleMenu() {
const m = $("menuPanel");
m.style.display = m.style.display === "flex" ? "none" : "flex";
}
$("menuBtn").onclick = toggleMenu;

function restart() {
toggleMenu();
startGame();
}

function showHistory() {
toggleMenu();
// 改为页面内弹层，避免 window.open 被浏览器拦截
let h = historyLog.slice(-12).map(h => `<b>${h.speaker || "　"}</b>：${h.text.replace(/\n/g," ")}`).join("<br><br>");
if (!h) h = "（暂无对话记录）";
let overlay = document.getElementById("historyOverlay");
if (!overlay) {
overlay = document.createElement("div");
overlay.id = "historyOverlay";
overlay.style.cssText = "position:absolute;inset:0;z-index:40;background:rgba(10,5,15,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:auto;";
document.getElementById("app").appendChild(overlay);
}
overlay.innerHTML = `<h2 style="color:#ffb6c8;font-size:22px;margin-bottom:20px;">对话回顾</h2><div style="max-width:600px;color:#f5f0f3;line-height:1.9;font-size:15px;text-align:left;">${h}</div><button class="menu-item" style="margin-top:28px;" onclick="document.getElementById('historyOverlay').style.display='none'">关闭</button>`;
overlay.style.display = "flex";
}

// 樱花粒子（仅初始化一次，避免重复定时器）
function spawnPetals() {
if (petalTimer) return;
petalTimer = setInterval(() => {
const p = document.createElement("div");
p.className = "petal";
p.style.left = Math.random() * 100 + "vw";
p.style.animationDuration = (6 + Math.random() * 5) + "s";
p.style.width = p.style.height = (8 + Math.random() * 8) + "px";
document.getElementById("app").appendChild(p);
setTimeout(() => p.remove(), 11000);
}, 400);
}

// 初始化背景
bgEl.style.backgroundImage = `url('${backgrounds.sakura}')`;
</script>
</body>
</html>
