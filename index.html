* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
width: 100%; height: 100%;
overflow: hidden;
font-family: "WenQuanYi Micro Hei", "PingFang SC", "Microsoft YaHei", sans-serif;

#app {
position: relative;
width: 100%; height: 100%;
max-width: 900px;
margin: 0 auto;
overflow: hidden;
}
#bg {
position: absolute; inset: 0;
background-size: cover;
background-position: center;
transition: background-image 0.8s ease;
filter: brightness(0.55);
}
#bg::after {
content: "";

background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.1) 100%);
}
#character {
position: absolute;
bottom: 0;
left: 50%;
transform: translateX(-50%);
height: 78%;
max-height: 640px;
opacity: 0;
transition: opacity 0.6s ease, transform 0.6s ease;
pointer-events: none;
filter: drop-shadow(0 0 30px rgba(255,180,200,0.15));
}
#character.show { opacity: 1; }
#dialogueBox {
position: absolute;
left: 50%; bottom: 16px;
transform: translateX(-50%);
width: calc(100% - 32px);
min-height: 170px;
background: rgba(20, 15, 25, 0.82);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 200, 220, 0.25);
border-radius: 16px;
padding: 18px 20px 56px;
color: #fff;
box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
#speaker {
font-size: 17px;
font-weight: bold;
color: #ffb6c8;
margin-bottom: 8px;
text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}
#text {
font-size: 16px;
line-height: 1.75;
min-height: 60px;
color: #f5f0f3;
}
.cursor {
display: inline-block;
width: 8px;
animation: blink 0.7s infinite;
color: #ffb6c8;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#nextHint {
position: absolute;
right: 18px; bottom: 14px;
font-size: 13px;
color: rgba(255,200,220,0.7);
animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
#choices {
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
width: calc(100% - 48px);

flex-direction: column;
gap: 12px;
z-index: 20;

.choice-btn {

color: #fff;

padding: 16px 20px;
border-radius: 12px;
cursor: pointer;

font-family: inherit;
}
.choice-btn:hover, .choice-btn:active {

#topBar {

#menuBtn {

align-items: center;

<script>
function playBGM(key) {
['bgmStandby','bgmState','bgmGame'].forEach(id => {
const el = document.getElementById(id);
if (!el) return;
if (id === 'bgm' + key.charAt(0).toUpperCase() + key.slice(1)) {
el.currentTime = 0;
el.playbackRate = 1.0;
el.play().catch(()=>{});
} else {
el.pause();
el.currentTime = 0;
}
});
}
function stopAllBGM() {
['bgmStandby','bgmState','bgmGame'].forEach(id => {
const el = document.getElementById(id);
if (el) { el.pause(); el.currentTime = 0; }
});
}
function playSFX(key) {
const idMap = { 'click': 'sfxClick', 'end': 'sfxEnd' };
const el = document.getElementById(idMap[key] || key);
if (el) { el.currentTime = 0; el.play().catch(()=>{}); }
}
function stopSFX(key) {
const idMap = { 'click': 'sfxClick', 'end': 'sfxEnd' };
const el = document.getElementById(idMap[key] || key);
if (el) { el.pause(); el.currentTime = 0; }
}

let currentNode = "start";
let typingTimer = null;
let isTyping = false;
let historyLog = [];
let petalTimer = null;
let selectedChapter = null;
const $ = id => document.getElementById(id);
const bgEl = $("bg");
const charEl = $("character");
const speakerEl = $("speaker");
const textEl = $("text");
const choicesEl = $("choices");
const dialogueBox = $("dialogueBox");
const CHAPTERS = [
{
id: "ch0",
title: "序章 · 樱花之约",
desc: "转学第一天，那个人的视线就黏在了你身上。",
startNode: "start",
require: null
},
{
id: "ch1",
title: "第一章 · 雨日图书馆",
desc: "雨天的图书馆，镜子里的两个人，谁先移开了视线？",
startNode: "ss1",
require: "ch0",
}
];
function getClearedChapters() {
try { return JSON.parse(localStorage.getItem("clearedChapters") || "[]"); } catch(e) { return []; }
}
function saveClearedChapter(id) {
const cleared = getClearedChapters();
if (!cleared.includes(id)) { cleared.push(id); localStorage.setItem("clearedChapters", JSON.stringify(cleared)); }
}
function openChapterPanel() {
playSFX('click');
stopAllBGM();
playBGM('standby');
const cleared = getClearedChapters();
const listEl = document.getElementById("chapterList");
listEl.innerHTML = "";
CHAPTERS.forEach(ch => {
let status = "locked";
if (ch.locked) {
status = "locked";
} else if (!ch.require) {
status = cleared.includes(ch.id) ? "cleared" : "available";
} else if (cleared.includes(ch.require)) {
status = cleared.includes(ch.id) ? "cleared" : "available";
}
const card = document.createElement("div");
card.className = "chapter-card" + (status === "locked" ? " locked" : "");
const statusText = status === "cleared" ? "已通关" : status === "available" ? "可进入" : ch.locked ? "未开放" : "未解锁";
card.innerHTML = `
<div class="chapter-title">${ch.title}</div>
<div class="chapter-desc">${ch.desc}</div>
<div class="chapter-status status-${status}">${statusText}</div>
`;
if (status !== "locked") {
card.onclick = () => openChapterModal(ch, status);
}
listEl.appendChild(card);
});
document.getElementById("chapterPanel").style.display = "flex";
}
function closeChapterPanel() {
playSFX('click');
document.getElementById("chapterPanel").style.display = "none";
}
function openChapterModal(ch, status) {
selectedChapter = ch;
playSFX('click');
const stateEl = $('bgmState');
stateEl.currentTime = 0;
stateEl.playbackRate = (status === 'cleared' || status === 'available') ? 1.0 : 0.75;
stateEl.play().catch(()=>{});
$('modalTitle').textContent = ch.title;
$('modalDesc').textContent = ch.desc;
$('modalCover').style.backgroundImage = `url('${backgrounds.sakura}')`;
$('modalStartBtn').textContent = status === 'cleared' ? '再玩一次' : '开始章节';
const modal = $('chapterModal');
modal.classList.remove('closing');
modal.style.display = 'flex';
void modal.offsetWidth;
modal.classList.add('show');
}
function closeChapterModal() {
playSFX('click');
const modal = $('chapterModal');
if (modal.style.display !== 'flex') return;
modal.classList.add('closing');
setTimeout(() => {
modal.classList.remove('show', 'closing');
modal.style.display = 'none';
}, 350);
}
function startSelectedChapter() {
if (!selectedChapter) return;
closeChapterModal();
$('titleScreen').style.display = 'none';
$('endingScreen').style.display = 'none';
$('chapterPanel').style.display = 'none';
dialogueBox.style.display = 'block';
stopAllBGM();
playBGM('game');
currentNode = selectedChapter.startNode;
historyLog = [];
showNode(selectedChapter.startNode);
spawnPetals();
}
buildScript();
function startGame() {
playSFX('click');
$('titleScreen').style.display = 'none';
openChapterPanel();
}
function showNode(id) {
const node = script[id];
if (!node) return;
currentNode = id;
if (node.ending) {
showEnding(node);
return;
}
if (node.bg) bgEl.style.backgroundImage = `url('${backgrounds[node.bg]}')`;
if (node.char && node.expr) {
charEl.src = characters[node.char][node.expr];
charEl.classList.add("show");
} else {
charEl.classList.remove("show");
}
speakerEl.textContent = node.speaker || "";
typeText(node.text || "");
if (node.text) historyLog.push({ speaker: node.speaker, text: node.text });
if (node.choices && node.choices.length > 0) {
setTimeout(() => showChoices(node.choices), 600);
} else {
choicesEl.style.display = "none";
}
}
function typeText(str) {
clearInterval(typingTimer);
textEl.innerHTML = "";
isTyping = true;
let i = 0;
typingTimer = setInterval(() => {
if (i < str.length) {
const ch = str[i] === "\n" ? "<br>" : (str[i] === "\b" ? "" : str[i]);
textEl.innerHTML += ch;
i++;
} else {
clearInterval(typingTimer);
isTyping = false;
}
}, 35);
}
function showChoices(choices) {
choicesEl.innerHTML = "";
choices.forEach(c => {
const btn = document.createElement("button");
btn.className = "choice-btn";
btn.textContent = c.text;
btn.onclick = () => {
playSFX('click');
choicesEl.style.display = "none";
showNode(c.next);
};
choicesEl.appendChild(btn);
});
choicesEl.style.display = "flex";
}
function showEnding(node) {
playSFX('end');
charEl.classList.remove("show");
dialogueBox.style.display = "none";
$("endingTitle").textContent = node.title;
$("endingText").textContent = node.text;
$("endingScreen").style.display = "flex";

// ★ 修复：结局时保存当前章节通关状态
if (selectedChapter) {
  saveClearedChapter(selectedChapter.id);
}
}
function backToTitle() {
$("endingScreen").style.display = "none";
dialogueBox.style.display = "block";
$("titleScreen").style.display = "flex";
bgEl.style.backgroundImage = `url('${backgrounds.sakura}')`;
stopAllBGM();
playBGM('standby');
}
document.addEventListener("click", (e) => {
if (e.target.tagName === "BUTTON") return;
if (e.target.closest("#choices")) return;
if (e.target.closest("#menuPanel")) return;
if ($("titleScreen").style.display !== "none") return;
if ($("endingScreen").style.display === "flex") return;
if ($("menuPanel").style.display === "flex") return;
const node = script[currentNode];
if (!node) return;
if (isTyping) {
clearInterval(typingTimer);
textEl.innerHTML = (node.text || "").replace(/\n/g, "<br>").replace(/\b/g, "");
isTyping = false;
} else if (node.choices && node.choices.length > 0) {
return;
} else if (node.next) {
showNode(node.next);
}
});
function toggleMenu() {
const m = $("menuPanel");
m.style.display = m.style.display === "flex" ? "none" : "flex";
}
$("menuBtn").onclick = () => { playSFX('click'); toggleMenu(); };
function restart() {
toggleMenu();
startGame();
}
function showHistory() {
toggleMenu();
let h = historyLog.slice(-12).map(h => `<b>${h.speaker || "　"}</b>：${h.text.replace(/\n/g," ")}`).join("<br><br>");
if (!h) h = "（暂无对话记录）";
let overlay = document.getElementById("historyOverlay");
if (!overlay) {
overlay = document.createElement("div");
overlay.id = "historyOverlay";
overlay.style.cssText = "position:absolute;inset:0;z-index:40;background:rgba(10,5,15,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:auto;";
document.getElementById("app").appendChild(overlay);
}
overlay.innerHTML = `<h2 style="color:#ffb6c8;font-size:22px;margin-bottom:20px;">对话回顾</h2><div style="max-width:600px;color:#f5f0f3;line-height:1.9;font-size:15px;text-align:left;">${h}</div><button class="menu-item" style="margin-top:28px;" onclick="document.getElementById('historyOverlay').style.display='none'">关闭</button>`;
overlay.style.display = "flex";
}
function spawnPetals() {
if (petalTimer) return;
petalTimer = setInterval(() => {
const p = document.createElement("div");
p.className = "petal";
p.style.left = Math.random() * 100 + "vw";
p.style.animationDuration = (6 + Math.random() * 5) + "s";
p.style.width = p.style.height = (8 + Math.random() * 8) + "px";
document.getElementById("app").appendChild(p);
setTimeout(() => p.remove(), 11000);
}, 400);
}
bgEl.style.backgroundImage = `url('${backgrounds.sakura}')`;
playBGM('standby');
</script>
